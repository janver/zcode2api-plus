# Docker 镜像 CI：推 v* tag 时构建 linux/amd64 + linux/arm64 双架构镜像，
# 推送到 GHCR（ghcr.io/<owner>/zcode2api-plus）；分支 push 与 PR 仅构建验证。
# 首次推送后镜像包默认为 Private，需到仓库 Settings → Packages 改为 Public
# 才能免登录拉取。
name: docker

on:
  push:
    tags: ["v*"]
    branches: ["go-rewrite"]
  pull_request:
    branches: ["go-rewrite"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=ref,event=pr
            type=raw,value=ci,enable=${{ github.event_name == 'workflow_dispatch' }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      # 版本号注入二进制（对齐 AppVersion 的 x.y.z-go 格式；验证构建用 dev-go）
      - name: Resolve version
        id: ver
        shell: bash
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            v="${TAG_NAME#v}"
          else
            v="dev"
          fi
          echo "value=$v-go" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.ver.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
